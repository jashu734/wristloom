name: Wristloom CI/CD Gatekeeper

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck, Test & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wristloom-frontend

    env:
      NODE_ENV: test
      AUTH_SECRET: "ci-dummy-auth-secret-for-build-and-lint-verification"
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
      RAZORPAY_KEY_ID: "rzp_test_ci_dummy_key_id"
      RAZORPAY_KEY_SECRET: "rzp_test_ci_dummy_key_secret"
      ALLOW_SIMULATED_PAYMENTS: "true"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: wristloom-frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: ESLint Validation
        run: npm run lint

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Run Automated Test Suite
        run: npm test

      - name: Production Build
        run: npm run build
