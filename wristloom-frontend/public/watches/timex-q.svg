<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="pepsiBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="500" height="500" fill="#14110f"/>
  <!-- Woven Steel Bracelet -->
  <rect x="205" y="20" width="90" height="135" fill="#a1a8b3" rx="2"/>
  <rect x="205" y="345" width="90" height="135" fill="#a1a8b3" rx="2"/>

  <!-- Steel Case -->
  <circle cx="250" cy="250" r="148" fill="#d1d5db" stroke="#6b7280" stroke-width="2"/>

  <!-- Iconic Pepsi Bezel: Top Half Red, Bottom Half Blue -->
  <path d="M 106,250 A 144,144 0 0,1 394,250 Z" fill="#b91c1c"/>
  <path d="M 106,250 A 144,144 0 0,0 394,250 Z" fill="#1d4ed8"/>

  <!-- Dial -->
  <circle cx="250" cy="250" r="118" fill="url(#pepsiBlue)"/>

  <!-- Day-Date at 3 -->
  <rect x="305" y="240" width="46" height="20" fill="#ffffff" stroke="#334155" stroke-width="1"/>
  <text x="328" y="254" font-family="sans-serif" font-size="9" font-weight="bold" fill="#0f172a" text-anchor="middle">MON 28</text>

  <!-- Brand -->
  <text x="250" y="195" font-family="'Cinzel', serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">Q TIMEX</text>
  <text x="250" y="208" font-family="sans-serif" font-size="7" fill="#93c5fd" text-anchor="middle">REISSUE 1979</text>
  <text x="250" y="305" font-family="sans-serif" font-size="6.5" fill="#cbd5e1" text-anchor="middle">TW2T80700 · 38MM</text>

  <!-- Hands with luminous inserts -->
  <line x1="250" y1="250" x2="250" y2="170" stroke="#fef08a" stroke-width="3"/>
  <line x1="250" y1="250" x2="295" y2="250" stroke="#fef08a" stroke-width="2"/>
  <line x1="250" y1="270" x2="250" y2="150" stroke="#ef4444" stroke-width="1"/>
  <circle cx="250" cy="250" r="4" fill="#ffffff"/>
</svg>