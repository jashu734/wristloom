<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="champagneDial" cx="45%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#fff8e7"/>
      <stop offset="60%" stop-color="#f5e5be"/>
      <stop offset="100%" stop-color="#dfc58f"/>
    </radialGradient>
    <linearGradient id="goldBracelet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b8934a"/>
      <stop offset="50%" stop-color="#f5df98"/>
      <stop offset="100%" stop-color="#b8934a"/>
    </linearGradient>
  </defs>
  <rect width="500" height="500" fill="#14110f"/>
  <rect x="205" y="20" width="90" height="135" fill="url(#goldBracelet)" rx="2"/>
  <rect x="205" y="345" width="90" height="135" fill="url(#goldBracelet)" rx="2"/>

  <!-- Polished Gold Case -->
  <circle cx="250" cy="250" r="144" fill="url(#goldBracelet)" stroke="#8e6f30" stroke-width="2"/>
  <circle cx="250" cy="250" r="130" fill="url(#champagneDial)" stroke="#caa45a" stroke-width="1"/>

  <text x="250" y="200" font-family="'Cinzel', serif" font-size="15" font-weight="bold" fill="#4d3b14" text-anchor="middle" letter-spacing="2">SONATA</text>
  <text x="250" y="213" font-family="sans-serif" font-size="7.5" fill="#78602c" text-anchor="middle">VOLT · 77083YM01</text>
  <text x="250" y="305" font-family="sans-serif" font-size="7" fill="#78602c" text-anchor="middle">WATER RESIST</text>

  <!-- Gold Baton Hands -->
  <line x1="250" y1="250" x2="250" y2="175" stroke="#684e1b" stroke-width="2.5"/>
  <line x1="250" y1="250" x2="310" y2="250" stroke="#684e1b" stroke-width="2"/>
  <circle cx="250" cy="250" r="4" fill="#684e1b"/>
</svg>