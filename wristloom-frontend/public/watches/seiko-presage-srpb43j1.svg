<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="caseSteel" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#d8dce2"/>
      <stop offset="85%" stop-color="#8a94a2"/>
      <stop offset="100%" stop-color="#555f6d"/>
    </radialGradient>
    <radialGradient id="iceBlueDial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0f7fc"/>
      <stop offset="40%" stop-color="#d6e8f7"/>
      <stop offset="80%" stop-color="#a4cae8"/>
      <stop offset="100%" stop-color="#7baecf"/>
    </radialGradient>
    <linearGradient id="blackLeather" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#15171a"/>
      <stop offset="50%" stop-color="#2d3238"/>
      <stop offset="100%" stop-color="#15171a"/>
    </linearGradient>
    <linearGradient id="bluedSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a52be"/>
      <stop offset="100%" stop-color="#1b367a"/>
    </linearGradient>
  </defs>

  <!-- Dark Atelier background -->
  <rect width="500" height="500" fill="#14110f"/>
  
  <!-- Subtle circular pedestal glow -->
  <circle cx="250" cy="250" r="210" fill="#1e1a17" opacity="0.6"/>

  <!-- Top Strap -->
  <rect x="200" y="20" width="100" height="120" rx="4" fill="url(#blackLeather)"/>
  <!-- Stitching -->
  <line x1="206" y1="20" x2="206" y2="140" stroke="#2a52be" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="294" y1="20" x2="294" y2="140" stroke="#2a52be" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Bottom Strap -->
  <rect x="200" y="360" width="100" height="120" rx="4" fill="url(#blackLeather)"/>
  <!-- Stitching -->
  <line x1="206" y1="360" x2="206" y2="480" stroke="#2a52be" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="294" y1="360" x2="294" y2="480" stroke="#2a52be" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Lugs -->
  <polygon points="190,130 210,70 230,120" fill="url(#caseSteel)"/>
  <polygon points="310,130 290,70 270,120" fill="url(#caseSteel)"/>
  <polygon points="190,370 210,430 230,380" fill="url(#caseSteel)"/>
  <polygon points="310,370 290,430 270,380" fill="url(#caseSteel)"/>

  <!-- Case Outer -->
  <circle cx="250" cy="250" r="148" fill="url(#caseSteel)" stroke="#454c56" stroke-width="2"/>
  
  <!-- Fluted Bezel Ring -->
  <circle cx="250" cy="250" r="136" fill="#ccd3dc" stroke="#9ba4b0" stroke-width="1.5"/>

  <!-- Crystal & Dial Outer -->
  <circle cx="250" cy="250" r="130" fill="url(#iceBlueDial)"/>

  <!-- Sunburst Guilloché Rays -->
  <g opacity="0.35" stroke="#ffffff" stroke-width="0.75">
    <line x1="250" y1="250" x2="378.0" y2="250.0"/><line x1="250" y1="250" x2="376.1" y2="272.2"/><line x1="250" y1="250" x2="370.3" y2="293.8"/><line x1="250" y1="250" x2="360.9" y2="314.0"/><line x1="250" y1="250" x2="348.1" y2="332.3"/><line x1="250" y1="250" x2="332.3" y2="348.1"/><line x1="250" y1="250" x2="314.0" y2="360.9"/><line x1="250" y1="250" x2="293.8" y2="370.3"/><line x1="250" y1="250" x2="272.2" y2="376.1"/><line x1="250" y1="250" x2="250.0" y2="378.0"/><line x1="250" y1="250" x2="227.8" y2="376.1"/><line x1="250" y1="250" x2="206.2" y2="370.3"/><line x1="250" y1="250" x2="186.0" y2="360.9"/><line x1="250" y1="250" x2="167.7" y2="348.1"/><line x1="250" y1="250" x2="151.9" y2="332.3"/><line x1="250" y1="250" x2="139.1" y2="314.0"/><line x1="250" y1="250" x2="129.7" y2="293.8"/><line x1="250" y1="250" x2="123.9" y2="272.2"/><line x1="250" y1="250" x2="122.0" y2="250.0"/><line x1="250" y1="250" x2="123.9" y2="227.8"/><line x1="250" y1="250" x2="129.7" y2="206.2"/><line x1="250" y1="250" x2="139.1" y2="186.0"/><line x1="250" y1="250" x2="151.9" y2="167.7"/><line x1="250" y1="250" x2="167.7" y2="151.9"/><line x1="250" y1="250" x2="186.0" y2="139.1"/><line x1="250" y1="250" x2="206.2" y2="129.7"/><line x1="250" y1="250" x2="227.8" y2="123.9"/><line x1="250" y1="250" x2="250.0" y2="122.0"/><line x1="250" y1="250" x2="272.2" y2="123.9"/><line x1="250" y1="250" x2="293.8" y2="129.7"/><line x1="250" y1="250" x2="314.0" y2="139.1"/><line x1="250" y1="250" x2="332.3" y2="151.9"/><line x1="250" y1="250" x2="348.1" y2="167.7"/><line x1="250" y1="250" x2="360.9" y2="186.0"/><line x1="250" y1="250" x2="370.3" y2="206.2"/><line x1="250" y1="250" x2="376.1" y2="227.8"/>
  </g>

  <!-- Hour Faceted Markers -->
  <g fill="#f8fafc" stroke="#687380" stroke-width="0.5">
    <circle cx="250.0" cy="140.0" r="3"/><circle cx="305.0" cy="154.7" r="3"/><circle cx="345.3" cy="195.0" r="3"/><circle cx="345.3" cy="305.0" r="3"/><circle cx="305.0" cy="345.3" r="3"/><circle cx="250.0" cy="360.0" r="3"/><circle cx="195.0" cy="345.3" r="3"/><circle cx="154.7" cy="305.0" r="3"/><circle cx="140.0" cy="250.0" r="3"/><circle cx="154.7" cy="195.0" r="3"/><circle cx="195.0" cy="154.7" r="3"/>
  </g>

  <!-- Date Window at 3 o'clock -->
  <rect x="330" y="240" width="24" height="20" rx="1" fill="#ffffff" stroke="#717a85" stroke-width="1"/>
  <text x="342" y="255" font-family="sans-serif" font-size="11" font-weight="bold" fill="#111827" text-anchor="middle">28</text>

  <!-- Seiko Brand Markings -->
  <text x="250" y="195" font-family="'Cinzel', 'Times New Roman', serif" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle" letter-spacing="2">SEIKO</text>
  <text x="250" y="210" font-family="sans-serif" font-size="7" fill="#475569" text-anchor="middle" letter-spacing="1">PRESAGE</text>
  <text x="250" y="305" font-family="sans-serif" font-size="6.5" fill="#475569" text-anchor="middle" letter-spacing="1">AUTOMATIC</text>
  <text x="250" y="316" font-family="sans-serif" font-size="5" fill="#64748b" text-anchor="middle">SRPB43J1 · 40.5mm</text>

  <!-- Crown -->
  <rect x="398" y="240" width="12" height="20" rx="2" fill="url(#caseSteel)" stroke="#505864" stroke-width="1"/>

  <!-- Hands -->
  <!-- Hour Hand -->
  <polygon points="248,252 248,205 250,190 252,205 252,252" fill="#e2e8f0" stroke="#475569" stroke-width="0.5"/>
  <!-- Minute Hand -->
  <polygon points="248.5,252 248.5,165 250,148 251.5,165 251.5,252" fill="#f1f5f9" stroke="#475569" stroke-width="0.5"/>
  <!-- Blued Seconds Needle Hand -->
  <line x1="250" y1="275" x2="250" y2="135" stroke="url(#bluedSteel)" stroke-width="1.2"/>
  <circle cx="250" cy="275" r="3" fill="#2a52be"/>

  <!-- Center Pin -->
  <circle cx="250" cy="250" r="4.5" fill="#cbd5e1" stroke="#334155" stroke-width="1"/>
</svg>