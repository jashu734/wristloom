<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="ceramicBlack" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#3d434a"/>
      <stop offset="50%" stop-color="#1f2327"/>
      <stop offset="100%" stop-color="#0a0c0e"/>
    </radialGradient>
    <linearGradient id="goldAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e6ca92"/>
      <stop offset="100%" stop-color="#b08d57"/>
    </linearGradient>
  </defs>
  <rect width="500" height="500" fill="#14110f"/>
  <rect x="205" y="25" width="90" height="130" fill="url(#ceramicBlack)" rx="3"/>
  <rect x="205" y="345" width="90" height="130" fill="url(#ceramicBlack)" rx="3"/>
  
  <!-- Ultra-thin ceramic case -->
  <circle cx="250" cy="250" r="145" fill="url(#ceramicBlack)" stroke="#454b52" stroke-width="1.5"/>
  <circle cx="250" cy="250" r="132" fill="#111315" stroke="#252a30" stroke-width="1"/>
  
  <!-- Minimalist indices -->
  <line x1="250" y1="130" x2="250" y2="142" stroke="url(#goldAccent)" stroke-width="2"/>
  <line x1="250" y1="358" x2="250" y2="370" stroke="url(#goldAccent)" stroke-width="2"/>
  <line x1="130" y1="250" x2="142" y2="250" stroke="url(#goldAccent)" stroke-width="2"/>
  <line x1="358" y1="250" x2="370" y2="250" stroke="url(#goldAccent)" stroke-width="2"/>

  <!-- Minimalist Text -->
  <text x="250" y="200" font-family="'Cinzel', serif" font-size="16" font-weight="bold" fill="url(#goldAccent)" text-anchor="middle" letter-spacing="3">TITAN</text>
  <text x="250" y="215" font-family="sans-serif" font-size="8" fill="#889098" text-anchor="middle" letter-spacing="2">EDGE CERAMIC</text>
  <text x="250" y="305" font-family="sans-serif" font-size="6.5" fill="#66707a" text-anchor="middle" letter-spacing="1">SLIM 4.4MM · 1696QC01</text>

  <!-- Hands -->
  <line x1="250" y1="250" x2="250" y2="185" stroke="url(#goldAccent)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="250" y1="250" x2="305" y2="250" stroke="url(#goldAccent)" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="250" cy="250" r="4" fill="url(#goldAccent)"/>
</svg>