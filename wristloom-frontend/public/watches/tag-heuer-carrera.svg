<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <rect width="500" height="500" fill="#14110f"/>
  <!-- Perforated Racing Leather -->
  <rect x="205" y="20" width="90" height="135" fill="#18181b" rx="3"/>
  <rect x="205" y="345" width="90" height="135" fill="#18181b" rx="3"/>

  <!-- Steel Case -->
  <circle cx="250" cy="250" r="148" fill="#e4e4e7" stroke="#71717a" stroke-width="2"/>
  <!-- Curved Sapphire Glassbox Tachymeter Ring -->
  <circle cx="250" cy="250" r="134" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
  <circle cx="250" cy="250" r="115" fill="#09090b"/>

  <!-- Tri-Compax Chrono Subdials -->
  <circle cx="205" cy="250" r="24" fill="#18181b" stroke="#52525b" stroke-width="1"/>
  <circle cx="295" cy="250" r="24" fill="#18181b" stroke="#52525b" stroke-width="1"/>
  <circle cx="250" cy="290" r="20" fill="#18181b" stroke="#52525b" stroke-width="1"/>

  <text x="250" y="180" font-family="sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">TAG HEUER</text>
  <text x="250" y="195" font-family="'Cinzel', serif" font-size="10" font-weight="bold" fill="#ef4444" text-anchor="middle" letter-spacing="1">CARRERA</text>
  <text x="250" y="325" font-family="sans-serif" font-size="6" fill="#a1a1aa" text-anchor="middle">CBS2210.FC6534 · 39MM</text>

  <!-- Red Chronograph Needle -->
  <line x1="250" y1="270" x2="250" y2="140" stroke="#ef4444" stroke-width="1.5"/>
  <circle cx="250" cy="250" r="4" fill="#ef4444"/>
</svg>