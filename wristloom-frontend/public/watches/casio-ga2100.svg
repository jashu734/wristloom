<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <rect width="500" height="500" fill="#14110f"/>
  <rect x="200" y="20" width="100" height="130" fill="#1c1f24" rx="4"/>
  <rect x="200" y="350" width="100" height="130" fill="#1c1f24" rx="4"/>

  <!-- Octagonal Bezel -->
  <polygon points="175,120 325,120 380,175 380,325 325,380 175,380 120,325 120,175" fill="#181a1d" stroke="#2a2e34" stroke-width="3"/>
  
  <!-- Dial Inner -->
  <circle cx="250" cy="250" r="115" fill="#0f1114"/>

  <!-- G-Shock Markings -->
  <text x="250" y="155" font-family="sans-serif" font-size="11" font-weight="900" fill="#717a86" text-anchor="middle" letter-spacing="2">G-SHOCK</text>
  <text x="250" y="195" font-family="sans-serif" font-size="12" font-weight="bold" fill="#9ca3af" text-anchor="middle">CASIO</text>
  <text x="250" y="210" font-family="sans-serif" font-size="7" fill="#64748b" text-anchor="middle">WR 20BAR · GA-2100</text>
  
  <!-- Stealth hands -->
  <line x1="250" y1="250" x2="250" y2="180" stroke="#e2e8f0" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="250" y1="250" x2="305" y2="250" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="250" cy="250" r="4.5" fill="#64748b"/>
</svg>