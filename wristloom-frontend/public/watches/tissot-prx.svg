<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="tissotBlue" cx="45%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="60%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
  </defs>
  <rect width="500" height="500" fill="#14110f"/>
  <!-- Integrated Tonneau Steel Bracelet -->
  <polygon points="185,20 315,20 300,140 200,140" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="200,360 300,360 315,480 185,480" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>

  <!-- Tonneau-shaped Case -->
  <path d="M 180,125 C 250,115 250,115 320,125 C 385,185 385,315 320,375 C 250,385 250,385 180,375 C 115,315 115,185 180,125 Z" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>

  <!-- Dial with Waffle / Tapisserie Texture -->
  <circle cx="250" cy="250" r="115" fill="url(#tissotBlue)"/>

  <text x="250" y="195" font-family="'Cinzel', serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">TISSOT</text>
  <text x="250" y="208" font-family="sans-serif" font-size="7" fill="#93c5fd" text-anchor="middle">1853</text>
  <text x="250" y="295" font-family="sans-serif" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">PRX</text>
  <text x="250" y="307" font-family="sans-serif" font-size="6.5" fill="#bfdbfe" text-anchor="middle">POWERMATIC 80</text>
  <text x="250" y="318" font-family="sans-serif" font-size="5" fill="#94a3b8" text-anchor="middle">T137.407.11.041.00 · 40MM</text>

  <!-- Baton Hands -->
  <line x1="250" y1="250" x2="250" y2="165" stroke="#f8fafc" stroke-width="2.5"/>
  <line x1="250" y1="250" x2="300" y2="250" stroke="#f8fafc" stroke-width="2"/>
  <circle cx="250" cy="250" r="4" fill="#cbd5e1"/>
</svg>