<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <rect width="500" height="500" fill="#14110f"/>
  <rect x="200" y="20" width="100" height="135" fill="#cbd5e1" rx="3"/>
  <rect x="200" y="345" width="100" height="135" fill="#cbd5e1" rx="3"/>

  <!-- Asymmetric Moonwatch Case -->
  <circle cx="250" cy="250" r="148" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <!-- Black Tachymetre Bezel "Dot Over 90" -->
  <circle cx="250" cy="250" r="136" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
  <circle cx="250" cy="250" r="115" fill="#09090b"/>

  <!-- Triple Chronograph Subdials -->
  <circle cx="195" cy="250" r="22" fill="#18181b" stroke="#52525b" stroke-width="1"/>
  <circle cx="305" cy="250" r="22" fill="#18181b" stroke="#52525b" stroke-width="1"/>
  <circle cx="250" cy="290" r="22" fill="#18181b" stroke="#52525b" stroke-width="1"/>

  <!-- Omega Logo and Speedmaster Text -->
  <text x="250" y="178" font-family="'Times New Roman', serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Ω</text>
  <text x="250" y="195" font-family="'Cinzel', serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">OMEGA</text>
  <text x="250" y="207" font-family="sans-serif" font-size="7" font-style="italic" fill="#e2e8f0" text-anchor="middle">Speedmaster</text>
  <text x="250" y="217" font-family="sans-serif" font-size="6" fill="#a1a1aa" text-anchor="middle">PROFESSIONAL</text>
  <text x="250" y="332" font-family="sans-serif" font-size="5.5" fill="#71717a" text-anchor="middle">310.30.42.50.01.002 · 42MM</text>

  <!-- Hands -->
  <line x1="250" y1="250" x2="250" y2="160" stroke="#ffffff" stroke-width="2.2"/>
  <line x1="250" y1="250" x2="295" y2="250" stroke="#ffffff" stroke-width="1.8"/>
  <circle cx="250" cy="250" r="4" fill="#ffffff"/>
</svg>